<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDP local — visor</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ---- Tema: oscuro técnico. Solo estilos; la lógica (JS) no depende de esto. ---- */
    :root {
      --bg: #060a13;
      --bg-2: #0a1020;
      --panel: rgba(15, 23, 42, .72);
      --panel-solid: #0e1628;
      --panel-2: rgba(30, 41, 59, .55);
      --line: rgba(148, 163, 184, .14);
      --line-strong: rgba(148, 163, 184, .26);
      --text: #e2e8f0;
      --text-strong: #f8fafc;
      --muted: #8b9bb4;
      --accent: #22d3ee;
      --accent-2: #8b5cf6;
      --accent-soft: rgba(34, 211, 238, .12);
      --ok: #34d399;
      --warn: #fbbf24;
      --no: #f87171;
      --grad: linear-gradient(90deg, var(--accent), var(--accent-2));
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --radius: 12px;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--text);
      color-scheme: dark;
    }
    * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    html { background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(139, 92, 246, .16), transparent 60%),
        radial-gradient(800px 500px at -10% 110%, rgba(34, 211, 238, .10), transparent 60%),
        linear-gradient(rgba(148, 163, 184, .045) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(90deg, rgba(148, 163, 184, .045) 1px, transparent 1px) 0 0 / 32px 32px,
        var(--bg);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    body.in { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
    [hidden] { display: none !important; }
    ::selection { background: rgba(34, 211, 238, .3); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---- Barra lateral ---- */
    body > aside {
      background: linear-gradient(180deg, rgba(10, 16, 32, .92), rgba(6, 10, 19, .96));
      border-right: 1px solid var(--line);
      backdrop-filter: blur(12px);
      color: var(--text); padding: 1.1rem .9rem; overflow-y: auto;
      position: sticky; top: 0; height: 100vh; box-sizing: border-box;
      align-self: start; overscroll-behavior: contain;
    }
    body > aside a {
      color: var(--muted); text-decoration: none; display: block;
      padding: .5rem .65rem; border-radius: 8px; font-size: .88rem;
      border: 1px solid transparent; transition: background .15s, color .15s, border-color .15s;
    }
    body > aside a:hover { background: var(--panel-2); color: var(--text-strong); }
    body > aside a.active {
      background: var(--accent-soft); color: var(--text-strong);
      border-color: rgba(34, 211, 238, .35);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .nav { margin: 0 0 1.1rem; padding: 0 0 1rem; border-bottom: 1px solid var(--line); display: grid; gap: .15rem; }
    .nav h2 {
      margin: 0 0 .8rem; padding: 0 .35rem; font-size: .78rem; font-weight: 600;
      font-family: var(--mono); letter-spacing: .14em; text-transform: uppercase;
      display: flex; align-items: center; gap: .55rem; color: var(--text-strong);
    }
    .nav h2::before {
      content: ""; width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 10px var(--accent), 0 0 2px var(--accent);
    }
    .nav a { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .badge {
      font-family: var(--mono); font-size: .64rem; letter-spacing: .03em; color: var(--accent);
      background: rgba(34, 211, 238, .08); border: 1px solid rgba(34, 211, 238, .22);
      padding: .08rem .4rem; border-radius: 99px; white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .badge.run { color: var(--warn); background: rgba(251, 191, 36, .08); border-color: rgba(251, 191, 36, .25); }
    .badge.ok { color: var(--ok); background: rgba(52, 211, 153, .08); border-color: rgba(52, 211, 153, .25); }
    .badge.no { color: var(--no); background: rgba(248, 113, 113, .08); border-color: rgba(248, 113, 113, .25); }

    /* ---- Contenido ---- */
    main { padding: 1.75rem 2.25rem 3rem; min-width: 0; }
    main h1, main h2 { color: var(--text-strong); letter-spacing: -.01em; }
    .estado {
      font-family: var(--mono); font-size: .7rem; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted);
    }
    body > aside .estado { color: var(--muted); }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-variant-numeric: tabular-nums; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; padding: .55rem .5rem; }
    th {
      color: var(--muted); font-size: .7rem; font-weight: 600; font-family: var(--mono);
      text-transform: uppercase; letter-spacing: .08em;
    }
    td { font-size: .88rem; }
    .ok { color: var(--ok); font-weight: 600; }
    .warn { color: var(--warn); }
    code {
      font-family: var(--mono); font-size: .85em; color: var(--accent);
      background: rgba(34, 211, 238, .08); border: 1px solid rgba(34, 211, 238, .16);
      padding: .08rem .35rem; border-radius: 5px;
    }
    .resumen {
      position: relative; background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 1.15rem 1.35rem; margin: 0 0 1.5rem;
      backdrop-filter: blur(10px); overflow: hidden;
    }
    .resumen::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: var(--grad); opacity: .85; }
    .resumen h1, .resumen h2 { margin: 0 0 .55rem; font-size: 1.2rem; font-weight: 600; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; margin: .75rem 0; }
    .mini { width: 100%; margin-top: .5rem; }
    .mini th, .mini td { font-size: .8rem; padding: .4rem .35rem; }
    .conf-bar { height: 6px; background: rgba(148, 163, 184, .14); border-radius: 99px; overflow: hidden; min-width: 64px; }
    .conf-bar > i { display: block; height: 100%; background: var(--grad); box-shadow: 0 0 8px rgba(34, 211, 238, .5); }
    .conf-bar.warn > i { background: var(--warn); box-shadow: 0 0 8px rgba(251, 191, 36, .45); }
    .kpi {
      background: linear-gradient(180deg, rgba(30, 41, 59, .6), rgba(15, 23, 42, .6));
      border: 1px solid var(--line); border-radius: 10px; padding: .75rem .85rem;
      transition: border-color .2s, transform .2s;
    }
    .kpi:hover { border-color: rgba(34, 211, 238, .35); transform: translateY(-1px); }
    .kpi b {
      display: block; font-family: var(--mono); font-size: 1.3rem; font-weight: 600;
      color: var(--text-strong); font-variant-numeric: tabular-nums; letter-spacing: -.01em;
    }
    .kpi b.ok { color: var(--ok); text-shadow: 0 0 14px rgba(52, 211, 153, .35); }
    .kpi b.warn { color: var(--warn); }
    .kpi span { font-size: .74rem; color: var(--muted); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .cols ul { margin: .3rem 0 0; padding-left: 1.1rem; }
    .cols li { margin: .2rem 0; }
    .bar { height: 8px; background: rgba(148, 163, 184, .14); border-radius: 99px; overflow: hidden; margin: .5rem 0 1rem; }
    .bar > i { display: block; height: 100%; background: var(--grad); box-shadow: 0 0 12px rgba(34, 211, 238, .55); }
    .bar.run > i { background: var(--warn); box-shadow: 0 0 12px rgba(251, 191, 36, .5); }
    .tabla-wrap {
      max-height: 62vh; overflow: auto; border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--panel); backdrop-filter: blur(10px);
    }
    .tabla-wrap table { margin: 0; }
    .tabla-wrap thead th { position: sticky; top: 0; background: var(--panel-solid); z-index: 1; border-bottom-color: var(--line-strong); }
    .tabla-wrap tbody tr { cursor: pointer; transition: background .12s; }
    .tabla-wrap tbody tr:hover { background: rgba(34, 211, 238, .05); }
    .tabla-wrap tbody tr.active { background: rgba(34, 211, 238, .12); box-shadow: inset 3px 0 0 var(--accent); }
    .muted { color: var(--muted); }
    .gold-ref { color: var(--muted); font-size: .8em; margin-top: .15rem; font-family: var(--mono); }
    .lote-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(340px, 1fr); gap: 1rem; align-items: start; }
    .captura {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
      backdrop-filter: blur(10px); padding: .95rem 1.1rem 1.1rem; max-height: 62vh; overflow: auto;
    }
    .captura h2 { margin: 0 0 .35rem; font-size: 1rem; color: var(--text-strong); }
    .captura table { margin-top: .5rem; }
    .formula {
      margin-top: 1rem; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--panel); padding: .95rem 1.1rem 1.1rem;
    }
    .formula p { margin: .35rem 0; font-size: .9rem; line-height: 1.5; }
    .formula-eq {
      margin: .45rem 0; padding: .65rem .8rem; background: rgba(2, 6, 15, .7);
      border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: 8px;
      font-family: var(--mono); font-size: .8rem; line-height: 1.55; color: #a5f3fc; white-space: pre-wrap;
    }

    /* ---- Login ---- */
    .login { min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box; }
    .card {
      position: relative; background: rgba(10, 16, 32, .82); backdrop-filter: blur(16px);
      border: 1px solid var(--line-strong); border-radius: 16px;
      padding: 2rem 1.9rem 1.6rem; width: min(400px, 100%); box-sizing: border-box;
      box-shadow: 0 0 0 1px rgba(34, 211, 238, .06), 0 30px 80px -20px rgba(0, 0, 0, .7), 0 0 60px -20px rgba(34, 211, 238, .25);
    }
    .card::before {
      content: ""; position: absolute; inset: -1px -1px auto; height: 2px;
      border-radius: 16px 16px 0 0; background: var(--grad);
    }
    .card .brand {
      display: flex; align-items: center; gap: .6rem; margin-bottom: 1.3rem;
      font-family: var(--mono); font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    }
    .card .brand i {
      width: 30px; height: 30px; border-radius: 8px; background: var(--grad);
      display: grid; place-items: center; box-shadow: 0 0 18px rgba(34, 211, 238, .45);
    }
    .card .brand i::after { content: ""; width: 10px; height: 10px; border: 2px solid #060a13; border-radius: 3px; }
    .card h1 { color: var(--text-strong); margin: 0 0 .4rem; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
    .card .sub { color: var(--muted); font-size: .86rem; line-height: 1.5; margin: 0 0 .4rem; }
    .card label {
      display: block; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted); margin: 1rem 0 .35rem;
    }
    .card input {
      width: 100%; box-sizing: border-box; padding: .7rem .8rem; font: inherit; font-size: .92rem;
      border-radius: 9px; border: 1px solid var(--line-strong); background: rgba(2, 6, 15, .75); color: var(--text-strong);
      transition: border-color .15s, box-shadow .15s;
    }
    .card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34, 211, 238, .18); }
    .card button {
      margin-top: 1.35rem; width: 100%; padding: .75rem; border: 0; border-radius: 9px;
      background: var(--grad); color: #04121a; font: inherit; font-weight: 700; font-size: .92rem;
      letter-spacing: .02em; cursor: pointer; transition: filter .15s, transform .15s, box-shadow .15s;
      box-shadow: 0 8px 24px -8px rgba(34, 211, 238, .6);
    }
    .card button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .card button:active { transform: translateY(0); }
    .card .foot {
      display: flex; align-items: center; gap: .45rem; margin: 1.2rem 0 0; padding-top: 1rem;
      border-top: 1px solid var(--line); font-family: var(--mono); font-size: .66rem;
      letter-spacing: .06em; color: var(--muted);
    }
    .card .foot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .err { color: var(--no); font-size: .84rem; min-height: 1.2em; margin: .6rem 0 0; }
    .out {
      color: var(--muted); font-family: var(--mono); font-size: .72rem; letter-spacing: .06em;
      text-transform: uppercase; cursor: pointer; margin: .9rem .65rem 0; transition: color .15s;
    }
    .out:hover { color: var(--no); }

    /* ---- Pantallas chicas ---- */
    @media (max-width: 900px) {
      body.in { grid-template-columns: 1fr; }
      body > aside { position: static; height: auto; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 1.25rem 1rem 2rem; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cols, .lote-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="gate" class="login">
    <form class="card" id="form">
      <div class="brand"><i></i>IDP · Visor de resultados</div>
      <h1>Acceso seguro</h1>
      <p class="sub">Acceso para el comité. Los datos se descifran en tu navegador.</p>
      <label for="user">Usuario</label>
      <input id="user" name="user" autocomplete="username" required>
      <label for="pass">Contraseña</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p class="err" id="err"></p>
      <p class="foot">AES-256-GCM · PBKDF2-SHA256 · descifrado local</p>
    </form>
  </div>
  <aside id="aside" hidden>
    <nav class="nav" id="nav"></nav>
    <div id="side-note"></div>
    <p class="out" id="out">Cerrar sesión</p>
  </aside>
  <main id="main" hidden></main>

        vault = await unlock(
          document.getElementById("user").value.trim(),
          document.getElementById("pass").value
        );
        showApp();
      } catch (e) {
        err.textContent = "Usuario o contraseña incorrectos.";
      }
    });
    document.getElementById("out").addEventListener("click", () => {
      vault = null;
      location.hash = "";
      location.reload();
    });
  </script>
</body>
</html>
